name: D13x build and pack

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout contest repository
        uses: actions/checkout@v4
        with:
          path: contest2026_011_ladelamuStudio

      - name: Checkout NuttX
        uses: actions/checkout@v4
        with:
          repository: open-vela/nuttx
          ref: dev-ai-contest-2026
          path: nuttx
          fetch-depth: 1

      - name: Checkout apps
        uses: actions/checkout@v4
        with:
          repository: open-vela/apps
          ref: dev-ai-contest-2026
          path: apps
          fetch-depth: 1

      - name: Checkout ArtInChip vendor tree
        uses: actions/checkout@v4
        with:
          repository: open-vela/vendor_artinchip
          ref: dev-ai-contest-2026
          path: vendor/artinchip
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake flex bison gperf \
            genromfs libselinux1 ninja-build python3 python3-pip wget
          pip3 install --break-system-packages kconfiglib pycryptodome pyelftools pyyaml

      - name: Install RISC-V toolchain
        run: |
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.2.0-3/xpack-riscv-none-elf-gcc-14.2.0-3-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          sudo tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt
          mkdir -p "$HOME/bin"
          for tool in ar gcc g++ ld nm objcopy objdump ranlib readelf size strip; do
            ln -s "/opt/xpack-riscv-none-elf-gcc-14.2.0-3/bin/riscv-none-elf-$tool" \
              "$HOME/bin/riscv32-unknown-elf-$tool"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "/opt/xpack-riscv-none-elf-gcc-14.2.0-3/bin" >> "$GITHUB_PATH"

      - name: Integrate, build and pack
        env:
          JOBS: 2
        run: contest2026_011_ladelamuStudio/scripts/build.sh "$GITHUB_WORKSPACE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: d13x-hengshan-pi-firmware
          path: |
            nuttx/nuttx
            vendor/artinchip/pack/prebuilt/d13x_hengshan-pi_v1.0.0.img
          retention-days: 7
