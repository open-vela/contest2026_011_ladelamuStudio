name: D13x 构建与打包

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出比赛仓
        uses: actions/checkout@v4
        with:
          path: contest2026_011_ladelamuStudio

      - name: 读取并校验版本
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < contest2026_011_ladelamuStudio/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效的四段版本号: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: 检出 NuttX
        uses: actions/checkout@v4
        with:
          repository: open-vela/nuttx
          ref: dev-ai-contest-2026
          path: nuttx
          fetch-depth: 1

      - name: 检出 apps
        uses: actions/checkout@v4
        with:
          repository: open-vela/apps
          ref: dev-ai-contest-2026
          path: apps
          fetch-depth: 1

      - name: 检出匠芯创 vendor 仓
        uses: actions/checkout@v4
        with:
          repository: open-vela/vendor_artinchip
          ref: dev-ai-contest-2026
          path: vendor/artinchip
          fetch-depth: 1

      - name: 安装主机依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake flex bison gperf \
            genromfs libselinux1 ninja-build python3 python3-pip wget
          pip3 install --break-system-packages kconfiglib pycryptodome pyelftools pyyaml

      - name: 安装 RISC-V 工具链
        run: |
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.2.0-3/xpack-riscv-none-elf-gcc-14.2.0-3-linux-x64.tar.gz -O /tmp/riscv-toolchain.tar.gz
          sudo tar -xzf /tmp/riscv-toolchain.tar.gz -C /opt
          mkdir -p "$HOME/bin"
          for tool in ar gcc g++ ld nm objcopy objdump ranlib readelf size strip; do
            ln -s "/opt/xpack-riscv-none-elf-gcc-14.2.0-3/bin/riscv-none-elf-$tool" \
              "$HOME/bin/riscv32-unknown-elf-$tool"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "/opt/xpack-riscv-none-elf-gcc-14.2.0-3/bin" >> "$GITHUB_PATH"

      - name: 集成、编译并打包
        env:
          JOBS: 2
        run: contest2026_011_ladelamuStudio/scripts/build.sh "$GITHUB_WORKSPACE"

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: d13x-hengshan-pi-${{ env.RELEASE_VERSION }}
          path: |
            nuttx/nuttx
            vendor/artinchip/pack/prebuilt/d13x_hengshan-pi_v${{ env.RELEASE_VERSION }}.img
            contest2026_011_ladelamuStudio/VERSION
            contest2026_011_ladelamuStudio/CHANGELOG.md
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-ai-contest-2026'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出发布元数据
        uses: actions/checkout@v4
        with:
          path: source

      - name: 下载已通过构建的产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 生成 Release 说明
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < source/VERSION)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          awk -v heading="## $version " '
            index($0, heading) == 1 {emit=1; next}
            emit && /^## / {exit}
            emit {print}
          ' source/CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          image=$(find release-artifacts -type f \
            -name "d13x_hengshan-pi_v${RELEASE_VERSION}.img" -print -quit)
          elf=$(find release-artifacts -type f -name nuttx -print -quit)
          test -s "$image"
          test -s "$elf"
          sha256sum "$image" "$elf" | sed 's#  .*/#  #' > SHA256SUMS

          tag_sha=""
          if existing_tag_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha' 2>/dev/null); then
            if [[ ! "$existing_tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "标签 ${RELEASE_TAG} 返回了无效 SHA: ${existing_tag_sha}" >&2
              exit 1
            fi

            tag_sha="$existing_tag_sha"
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "标签 ${RELEASE_TAG} 已指向 ${tag_sha}，不能改写为 ${GITHUB_SHA}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "D13x Hengshan-Pi ${RELEASE_VERSION}" \
              --notes-file release-notes.md
          elif [[ -n "$tag_sha" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "D13x Hengshan-Pi ${RELEASE_VERSION}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "D13x Hengshan-Pi ${RELEASE_VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "$image" "$elf#nuttx-${RELEASE_VERSION}" \
            source/VERSION source/CHANGELOG.md SHA256SUMS
